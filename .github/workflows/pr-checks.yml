name: PR Validation Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Validate module files
        run: node scripts/validate-modules.mjs

      - name: Verify catalog index is up to date
        run: |
          node scripts/build-index.mjs
          if [ -n "$(git status --porcelain index.json index.min.json)" ]; then
            echo "Catalog index is out of date or untracked. Please run npm run build:index."
            exit 1
          fi
          git ls-files --error-unmatch index.json index.min.json > /dev/null
